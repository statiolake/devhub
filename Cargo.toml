[workspace]
members = [
    "apps/devhub/src-tauri",
    "crates/devhub-app-core",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.97.1"
license = "MIT"

[patch.crates-io]
# ADR 0013 requires Editor child views to have no implicit WRY IPC global.
# ADR 0011 also requires ordinary child Command shortcuts to remain native.
# This exact 0.55.1 fork contains only those no-handler and macOS key-responder
# hooks; the AppKit monitor returns the original NSEvent for forwarding.
wry = { path = "apps/devhub/src-tauri/vendor/wry" }
