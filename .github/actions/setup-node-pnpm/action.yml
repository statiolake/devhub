name: Set up Node.js and pnpm
description: >-
  The workspace's Node (.nvmrc) and pnpm (package.json `packageManager`), with
  the pnpm store cached, Go (cli/go.mod) for the `devhub` command the app
  build compiles, and optionally `pnpm install --frozen-lockfile`. No version
  is written here: each is stated once in the repository and
  read from there.

inputs:
  install:
    description: Run `pnpm install --frozen-lockfile` after setting up.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    # pnpm has to exist before setup-node runs: `cache: pnpm` shells out to
    # `pnpm store path` to find the cache directory, and a runner starts with no
    # pnpm on its PATH. Corepack ships with the runner's default Node; `corepack
    # install` fetches the version package.json's `packageManager` names.
    - name: Activate the pinned pnpm
      shell: bash
      run: corepack enable && corepack install

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml

    # The `devhub` command is Go (cli/, docs/devhub-cli.md), built from source
    # by `pnpm --filter @devhub/desktop build`, so every job that builds the
    # app needs it.
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: cli/go.mod
        cache-dependency-path: cli/go.mod

    # The bash the app carries (`build:bash`, docs/bundled-binaries.md): on
    # macOS it is compiled from the pinned source, once per pin.
    - name: Restore the bundled bash
      uses: actions/cache@v4
      with:
        path: ~/.cache/devhub/bash
        key: bash-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_bash.py', 'scripts/build_tmux.py', 'apps/desktop/product.json') }}

    - name: Install JavaScript dependencies
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
