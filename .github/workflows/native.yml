name: Native

# The native macOS DevHub (Swift, no TypeScript): native/ on the native-macos
# branch. See native/docs/PLAN.md and native/README.md.
#
#   Core + CLI on Linux (swift:6.1-noble) ──┐
#   Build, test, bundle on macOS ───────────┘  in parallel
#
# The Linux job is the same check the agents run locally in Docker: it keeps
# DevHubCore free of AppKit/CryptoKit. The macOS job is the real one: it
# builds the App target too, runs the tests, bundles DevHub.app, runs its
# self-test (the window from a fixture on a loopback transport, then the real
# runtime on a private tmux server) and uploads the bundle.
on:
  push:
    branches: [native-macos, "native-macos-*"]
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  pull_request:
    paths:
      - "native/**"
      - ".github/workflows/native.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: "Native: Core + CLI (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.1-noble
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: CLI answers --version
        run: .build/debug/devhub --version

  macos:
    name: "Native: build, test and bundle DevHub.app (macOS)"
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: native
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0

      - name: Toolchain
        run: |
          xcode-select -p
          swift --version
          sw_vers

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: native/.build/checkouts
          key: spm-${{ runner.os }}-${{ hashFiles('native/Package.swift', 'native/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve dependencies
        run: |
          swift package resolve
          cat Package.resolved

      # The compiler's errors, once each, at the end of the log: a failing
      # build repeats every error for every file compiled with it.
      - name: Build (debug)
        run: |
          set -o pipefail
          swift build 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            echo "---- errors ----"
            grep -E "^/.*: error:" "$RUNNER_TEMP/build.log" | sort -u | head -40
            exit 1
          }

      - name: Test
        run: swift test

      - name: Bundle DevHub.app (release)
        run: Scripts/bundle-app.sh --output "$RUNNER_TEMP/native"

      # The self-test's live phase attaches to a private tmux server.
      - name: Install tmux
        timeout-minutes: 5
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew list tmux >/dev/null 2>&1 || brew install tmux

      - name: Self-test the bundle
        timeout-minutes: 6
        env:
          DEVHUB_SELF_TEST_SNAPSHOTS: ${{ runner.temp }}/snapshots
          DEVHUB_SELF_TEST_PRINT_SNAPSHOTS: "1"
        run: |
          app="$RUNNER_TEMP/native/DevHub.app"
          "$app/Contents/Resources/bin/devhub" --version
          "$app/Contents/MacOS/DevHub" --self-test

      - name: Zip
        run: |
          cd "$RUNNER_TEMP/native"
          ditto -c -k --keepParent DevHub.app DevHub-native.zip

      - name: Upload DevHub.app
        uses: actions/upload-artifact@v4
        with:
          name: DevHub-native-${{ github.sha }}
          path: ${{ runner.temp }}/native/DevHub-native.zip
          retention-days: 14
          if-no-files-found: error

      # The conversation's fixture transcripts as the self-test drew them (WP10).
      - name: Upload the self-test's snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DevHub-native-snapshots-${{ github.sha }}
          path: ${{ runner.temp }}/snapshots
          retention-days: 14
          if-no-files-found: ignore
