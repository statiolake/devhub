name: CI

# The per-push checks: every change that reaches main, and every pull request.
#
# This workflow answers one question — is this change broken? — as fast as it
# can. It does not produce anything anyone downloads: the product build (the
# speech recogniser, the zip, the release) is the nightly's, and so are the
# longer tests against that packaged app. See docs/ci.md for the whole
# pipeline.
#
#   Test: static checks and unit tests (Linux) ──────────────┐
#   Test: desktop tests (macOS) ─────────────────────────────┤  all in parallel
#   Build: DevHub.app (macOS) ──> Test: app (macOS) ─────────┘
#
# Together the jobs run exactly what `pnpm run check` runs, plus a test build
# of the app and the app-level tests on it. Nothing here touches the `vscode`
# submodule: DevHub no longer has one to build (docs/without-vscode.md).
#
# The repository is public, so the standard runners cost nothing; they still
# cost *time*, so `concurrency` cancels a branch's older run the moment a newer
# commit lands on it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One live run per branch. A superseded commit's result is not worth waiting
  # for, and a pull request that is pushed to twice in a minute would otherwise
  # hold several macOS runners to answer the same question.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  # Everything in `pnpm run check` that does not need macOS: formatting, lint,
  # the typecheck and the Python script tests.
  checks:
    name: "Test: static checks and script tests (Linux)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Format
        run: pnpm run fmt

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Script tests (python3 -m unittest scripts/*_test.py)
        run: pnpm run test:scripts

      - name: devhub command (gofmt, go vet, go test in cli/)
        run: pnpm run test:cli

  # The desktop app's tests on the platform it ships for: vitest, and the
  # terminal tests that load node-pty in DevHub's own Electron.
  test-desktop:
    name: "Test: desktop unit tests (macOS)"
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # `test` fetches the Neovim DevHub bundles (build:nvim) first: the tests
      # that need a real Neovim run that one.
      - name: Desktop unit tests (vitest, node-pty under Electron)
        run: pnpm --filter @devhub/desktop test

  # A test build of the app: only what the app-level tests need. No speech
  # recogniser and no zip; the nightly builds and tests those for real.
  build-app:
    name: "Build: DevHub.app test build (macOS)"
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      - name: Build DevHub.app
        run: scripts/build-app.sh --without-whisper --no-zip

      # One tar rather than the bundle's thousands of files: the artifact
      # service uploads file by file and drops symlinks and modes, which a
      # signed app bundle needs.
      - name: Pack the bundle
        run: tar -cf dist/DevHub.app.tar -C dist DevHub.app

      - name: Hand the app to the app tests
        uses: actions/upload-artifact@v4
        with:
          name: DevHub-app-test-build
          path: dist/DevHub.app.tar
          compression-level: 1
          retention-days: 1
          if-no-files-found: error

  # Tests that start the app. A macOS runner has a GUI session, so this is
  # where the end-to-end suite goes when there is one; today it is the smoke
  # test: start the bundle under a throwaway profile, make it answer on its
  # control socket and open a file in its editor.
  test-app:
    name: "Test: app (macOS)"
    needs: build-app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # For the test scripts only; the app comes from the build job.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collect the app
        uses: actions/download-artifact@v4
        with:
          name: DevHub-app-test-build
          path: dist

      - name: Unpack the bundle
        run: tar -xf dist/DevHub.app.tar -C dist

      # The editor the smoke test opens a file in is the Neovim inside the
      # bundle (out/nvim), run by tmux, which this Mac provides.
      - name: Install tmux
        run: brew install tmux

      - name: Smoke-test the app
        run: scripts/smoke_packaged_app.py dist/DevHub.app
