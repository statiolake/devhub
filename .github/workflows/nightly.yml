# Package `main` every night and publish the result as a rolling prerelease.
#
# 18:00 UTC is 03:00 the next morning in JST, so the build that runs is the one
# for the day's work. A scheduled run first asks scripts/nightly-build-needed.sh
# whether main has moved since the standing release was cut, and stops there if
# it has not: rebuilding the same commit costs two hours of a macOS runner,
# produces an equivalent app, and breaks every existing download link to publish
# it. A run someone asks for by hand (Actions -> Nightly -> Run workflow, or
# `gh workflow run Nightly`) always builds — asking for it is the point.
#
# The long pole is the VS Code submodule: `npm ci` and `npm run compile` in
# vscode/ take the better part of half an hour, and they produce exactly the
# same tree until the submodule commit, its lockfile, its Node version or
# DevHub's patches change. One cache keyed on all four therefore turns the
# common nightly run into a build of DevHub's own code plus the packaging step.
#
# The result is unsigned beyond an ad-hoc signature. Signing needs a paid Apple
# Developer identity in the repository's secrets; until there is one, the
# release notes tell people how to clear the quarantine flag themselves.
#
# The other half of a DevHub is the remote extension host — the server SSH
# development downloads onto the machine you are working on. It is published by
# a separate set of jobs here, on a separate release, because it answers to a
# different question: the app is rebuilt when *DevHub* moves, and the server is
# rebuilt when the *VS Code submodule* moves, which is roughly monthly. See
# docs/remote-ssh.md and scripts/build_reh.py.
name: Nightly

on:
  workflow_dispatch:
    inputs:
      force_reh:
        description: >-
          Rebuild and replace the remote extension host for the current VS Code
          commit, even though its release already exists. What this is for: a
          change to patches/vscode that touches server code, which does not
          move the submodule and so does not change the URL remotes fetch.
        type: boolean
        default: false
  schedule:
    # 18:00 UTC = 03:00 JST.
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  # Never two nightlies at once: they would race for the same rolling tag.
  group: nightly
  cancel-in-progress: false

jobs:
  # A minute of a Linux runner to decide whether to spend two hours of a macOS
  # one. Nothing here needs the submodule or a build.
  decide:
    name: Is there anything new to package?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decision.outputs.needed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Only the schedule is gated. Someone who opened the Actions tab and
          # pressed the button has said what they want, and a workflow that
          # answers "no thanks" to a direct request is a workflow people stop
          # trusting; a rebuild of the same commit is what they get.
          if [ "$EVENT" != "schedule" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "started by $EVENT, so building regardless"
            exit 0
          fi
          scripts/nightly-build-needed.sh "$GITHUB_SHA"

  package:
    name: DevHub.app (darwin-arm64)
    needs: decide
    if: needs.decide.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Describe this build
        id: meta
        run: |
          {
            echo "date=$(date -u +%Y%m%d)"
            echo "sha=$(git rev-parse --short HEAD)"
            echo "vscode_sha=$(git -C vscode rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The expensive half of what scripts/provision-vscode.sh produces, under
      # one key: a miss costs the full npm ci and both compiles. Deliberately
      # not here are the nested node_modules that VS Code's postinstall creates
      # under build/ and extensions/* — 3.4 GB, more than this cache should
      # carry. Provisioning notices they are missing on a hit and reinstalls
      # just those, which is minutes; see the script.
      #
      # `out-vscode-min` is the bundled tree the packaged app ships and is
      # cached beside `out` because the stamp covers both: a hit that restored
      # only one of them would find the stamp current, the other tree missing,
      # and rebuild both. `out-build` is not cached — it is an intermediate
      # `core-ci` regenerates in the same minute it would take to restore.
      - name: Restore the provisioned VS Code build
        id: vscode-cache
        uses: actions/cache@v4
        with:
          path: |
            vscode-toolchain
            vscode/node_modules
            vscode/out
            vscode/out-vscode-min
            vscode/.build
          key: >-
            vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.vscode_sha }}-${{
            hashFiles('vscode/package-lock.json', 'vscode/.nvmrc', 'patches/vscode/*.patch') }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision the VS Code submodule
        env:
          # The nested installs under build/ and extensions/* download
          # prebuilt binaries (ripgrep among them) from GitHub releases;
          # unauthenticated requests from shared runner addresses hit the
          # rate limit (403). The token is only there for that limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/provision-vscode.sh

      # The same entry point a developer runs on their own Mac, so there is one
      # build to keep working rather than a local one and a CI one. It repeats
      # the install and the provision above, which are idempotent and cost
      # seconds once the cache has been restored, and then builds DevHub's
      # packages and assembles the bundle.
      - name: Build DevHub.app
        env:
          # The built-in extension set pulls a handful of extensions from
          # GitHub releases; the token is only there for the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run build

      # The build assembles the bundle and stops there — starting a DevHub has
      # effects on the machine that starts it, which a developer running
      # `pnpm build` never asked for. A runner is disposable, so here the app
      # is started and asked something over its control socket: that is the
      # only way to catch a bundle whose main process comes up and then stops
      # pumping its event loop.
      - name: Smoke-test the packaged app
        run: pnpm run smoke

      # The same zip, reachable without a release, for debugging a run.
      - name: Upload the zip as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: DevHub-darwin-arm64-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
          path: dist/*.zip
          retention-days: 7
          if-no-files-found: error

      - name: Write the release notes
        run: |
          cat > dist/notes.md <<'NOTES'
          A nightly build of DevHub for macOS on Apple Silicon. It is not
          signed by a registered developer and it is not notarised, so your
          browser quarantines the download. Clear the flag on the **zip**, and
          only then unpack it:

          ```sh
          xattr -d com.apple.quarantine ~/Downloads/DevHub-darwin-arm64-*.zip
          ```

          Then unzip it — double-clicking is enough — and move `DevHub.app`
          where you keep applications. Order matters: whatever unpacks the
          archive copies the flag onto every one of the app's 20,000 files,
          and `xattr -dr` over the unpacked bundle is then the slow way round.
          Cleared on the archive, there is nothing to propagate and nothing to
          clean up. (`No such xattr` means the download was never quarantined;
          carry on.)

          The first launch asks for access to the keychain item "DevHub Safe
          Storage" — that is the app creating the store VS Code keeps secrets
          in. Answer once and it stops asking.

          Requires macOS 15 or later on Apple Silicon. There is no update
          mechanism: replace the app with the next nightly.
          NOTES
          {
            echo ""
            echo "Built from \`${{ github.sha }}\` with VS Code \`${{ steps.meta.outputs.vscode_sha }}\`."
            echo ""
            echo "[The run that produced it](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } >> dist/notes.md

      # One rolling prerelease, replaced whole: the tag has to move to the
      # commit that was packaged, and a release cannot be retagged in place.
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly ${{ steps.meta.outputs.date }} (${{ steps.meta.outputs.sha }})" \
            --notes-file dist/notes.md \
            dist/*.zip

  # ---------------------------------------------------------------------------
  # The remote extension host: the server half of SSH development.
  #
  # Three jobs rather than one because the answer to "is a new one needed?" is
  # cheap and the build is not, and because the two architectures cannot be
  # built on one machine. `vscode/remote/node_modules` holds native addons —
  # node-pty, @parcel/watcher, kerberos, @vscode/spdlog — and the package task
  # copies them into the tarball as npm installed them, for the machine doing
  # the installing. So an arm64 server is built on an arm64 runner and an x64
  # one on an x64 runner, and there is no cross-building to get subtly wrong.
  # Both Linux runners are free on a public repository.
  # ---------------------------------------------------------------------------

  reh-decide:
    name: Is there a new server to build?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decision.outputs.needed }}
      tag: ${{ steps.decision.outputs.tag }}
    steps:
      # The submodule pointer is all this needs, and `git submodule status`
      # reads it out of the parent tree without checking anything out.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_reh }}
        run: |
          set -euo pipefail
          vscode_sha="$(git submodule status -- vscode | awk '{print $1}' | tr -d '+-')"
          tag="reh-${vscode_sha}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # The server is a function of the VS Code commit, and its download URL
          # names that commit — so a release that exists is a release every
          # DevHub built from this submodule is already pointing at, and
          # rebuilding it would replace working downloads with identical ones.
          if [ "$FORCE" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "asked to rebuild $tag"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "no $tag yet"
          fi

  reh:
    name: Server (${{ matrix.target }})
    needs: reh-decide
    if: needs.reh-decide.outputs.needed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      # One failing architecture must not cancel the other: knowing that only
      # arm64 is broken is the whole of the diagnosis.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    env:
      CI: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Describe this build
        id: meta
        run: echo "vscode_sha=$(git -C vscode rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # `npm ci` in vscode/ builds the native addons the server ships, and the
      # GitHub Linux images carry none of their headers. kerberos is the one
      # that stops first — `gssapi/gssapi.h: No such file or directory`, on
      # both architectures — because its prebuild is not for the Node 24 the
      # toolchain pins, so node-gyp compiles it from source. The rest of the
      # list is what upstream installs before the same install
      # (`vscode/build/azure-pipelines/dependencies-check.yml`), minus
      # `libnotify-bin`, which only its tests use: fixing them one header at a
      # time would be several nightlies spent rediscovering a list VS Code
      # already wrote down. macOS needs none of it, which is why this step is
      # here and not in the packaging job.
      - name: Install the headers the native addons compile against
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libkrb5-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxkbfile-dev

      - name: Activate pinned pnpm
        run: corepack enable && corepack prepare pnpm@11.20.0 --activate

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.1
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # The same cache the macOS job keeps, keyed the same way and separate from
      # it by `runner.os` and `runner.arch`. A hit turns provisioning into the
      # nested npm installs and skips both compiles; the server bundle is then
      # rebuilt regardless, because it has to be made against DevHub's
      # product.json rather than the submodule's. See scripts/build_reh.py.
      - name: Restore the provisioned VS Code build
        uses: actions/cache@v4
        with:
          path: |
            vscode-toolchain
            vscode/node_modules
            vscode/out
            vscode/out-vscode-min
            vscode/.build
          key: >-
            vscode-${{ runner.os }}-${{ runner.arch }}-${{ steps.meta.outputs.vscode_sha }}-${{
            hashFiles('vscode/package-lock.json', 'vscode/.nvmrc', 'patches/vscode/*.patch') }}

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Provision the VS Code submodule
        env:
          # As on the macOS job: the nested installs and the built-in extension
          # set pull prebuilt binaries from GitHub releases, and unauthenticated
          # requests from shared runner addresses hit the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/provision-vscode.sh

      - name: Build the server tarball
        run: scripts/build_reh.py ${{ matrix.target }} --skip-provision --out-dir dist

      # Kept whole rather than published here: the release is created once, by
      # the job below, when every architecture has one. A release that exists
      # with half its assets is a 404 for the other half of the people who
      # upgrade, and the URL is baked into their app.
      - name: Hand the tarball to the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: reh-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  reh-publish:
    name: Publish the server release
    needs: [reh-decide, reh]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect the tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: reh-*
          merge-multiple: true
          path: dist

      # Not the rolling `nightly` tag. That one is deleted and recreated every
      # night; this one is named after the VS Code commit and never moves, so
      # an app built months ago goes on finding the server it was told to fetch.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out — it only moves two files
          # from the artifact store to a release — so `gh` has no working tree
          # to infer the repository from and has to be told.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.reh-decide.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "Remote extension host $TAG" \
              --notes "The server half of DevHub's SSH remote development, built from the VS Code commit this tag is named after. DevHub downloads it onto a remote machine by itself; see docs/remote-ssh.md for the URL it uses and for installing one by hand." \
              dist/*.tar.gz
          fi
