# The product build: package `main` every night, test the packaged app, and
# publish it as a rolling prerelease. The per-push CI (ci.yml) only asks
# whether a change is broken; everything that makes a DevHub someone downloads
# — the remote extension hosts, the speech recogniser, the full `core-ci`
# VS Code bundle, the zip, the release — is built here. See docs/ci.md.
#
#   Decide ──> Build: REH <target> (x4, parallel) ──> Publish: prebuilt REH
#                                  └──> Build: DevHub.app ──> Test: packaged app ──> Publish: nightly release
#   Decide: tmux ──> Build: tmux <target> (x2) ──> Publish: tmux release
#
# 18:00 UTC is 03:00 the next morning in JST, so the build that runs is the one
# for the day's work. A scheduled run first asks scripts/nightly-build-needed.sh
# whether main has moved since the standing release was cut, and stops there if
# it has not: rebuilding the same commit costs hours of runners, produces an
# equivalent app, and breaks every existing download link to publish it. A run
# someone asks for by hand (Actions -> Nightly -> Run workflow, or `gh workflow
# run Nightly`) always builds — asking for it is the point.
#
# The result is unsigned beyond an ad-hoc signature. Signing needs a paid Apple
# Developer identity in the repository's secrets; until there is one, the
# release notes tell people how to clear the quarantine flag themselves.
#
# The app carries four remote extension hosts (Contents/Resources/reh: glibc
# and musl Linux, x64 and arm64) — the server DevHub copies onto an SSH host or
# into a dev container to open a remote window there. They are built here,
# every time the app is, from the same patched VS Code, one job per server, and
# handed to the macOS job, which bundles them. `reh-publish` also puts each, by
# identity, on the rolling `reh` prerelease, so a developer's `pnpm build`
# (scripts/ensure_reh.py) and the next night's jobs can download the servers
# instead of spending an hour building them. See docs/remote-ssh.md,
# scripts/build_reh.py and scripts/reh_release.py.
#
# A third set of jobs publishes a statically linked tmux, on the same shape and
# for the same reason: DevHub runs every terminal and every Agent inside tmux on
# the machine the Workspace is on, must not require the host to have one, and
# must not use the host's if it does. That one answers to the tmux version
# pinned in scripts/build_tmux.py and to nothing else here.
name: Nightly

on:
  workflow_dispatch:
    inputs:
      force_tmux:
        description: >-
          Rebuild and replace the tmux tarballs for the pinned version, even
          though their release already exists. What this is for: a change to
          scripts/build_tmux.py that does not move the tmux version — a
          terminfo entry added, a configure flag corrected.
        type: boolean
        default: false
  schedule:
    # 18:00 UTC = 03:00 JST.
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  # Never two nightlies at once: they would race for the same rolling tag.
  group: nightly
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  # A minute of a Linux runner to decide whether to spend hours of the others.
  # Nothing here needs the submodule or a build.
  decide:
    name: "Decide: anything new to package?"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decision.outputs.needed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Only the schedule is gated. Someone who opened the Actions tab and
          # pressed the button has said what they want, and a workflow that
          # answers "no thanks" to a direct request is a workflow people stop
          # trusting; a rebuild of the same commit is what they get.
          if [ "$EVENT" != "schedule" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "started by $EVENT, so building regardless"
            exit 0
          fi
          scripts/nightly-build-needed.sh "$GITHUB_SHA"

  # ---------------------------------------------------------------------------
  # The remote extension hosts the app carries.
  #
  # Built the way VS Code builds its own, on Linux x64 for every architecture
  # (build/azure-pipelines/linux/steps/product-build-linux-setup.yml and
  # -compile.yml, alpine/product-build-alpine.yml): scripts/build_reh.py runs
  # upstream's `npm ci` with setup-env.sh's glibc 2.28 sysroot toolchain, the
  # server's part of `gulp core-ci` and `gulp vscode-reh-<platform>-<arch>-min-ci`
  # in an amd64 Ubuntu 22.04 container on a copy of the pinned, patched VS
  # Code, and installs the musl servers' `remote/` in `node:<version>-alpine` of
  # the target's platform, as upstream's Alpine pipeline does. Nothing is
  # provisioned on the runner itself: it needs git, python3 and Docker, which
  # ubuntu-latest has. QEMU runs the arm64 containers (alpine-arm64's
  # `remote/` install and each arm64 server's start check).
  #
  # One job per server, all four in parallel. linux-<arch> and alpine-<arch>
  # could share one tree (`npm ci` + the server's `core-ci`, the long part), and
  # one job per architecture would prepare it once and package both servers
  # from it, one after the other. Per server prepares each tree twice, on
  # separate runners, which costs runner minutes (free here: the repository is
  # public) and buys wall-clock: the app job waits for the slowest server,
  # which is now one tree plus one package step rather than one tree plus two
  # — alpine-arm64's, whose `remote/` install and start check run under QEMU,
  # no longer queues behind linux-arm64's. It also lets a server that is
  # already published skip its job outright (below), which a shared job could
  # only do when both of its servers were. The tree is >10 GB in a Docker
  # volume, too big for the Actions cache, so it is not carried between jobs.
  #
  # Built on every night the app is: the servers are DevHub's patches as much
  # as VS Code's, and the app refuses servers of another identity. But the
  # identity is the whole input, so a server whose identity the `reh` release
  # already has is downloaded (and verified) instead — most nights after the
  # first one following a VS Code bump or a patch edit.
  # ---------------------------------------------------------------------------

  reh:
    name: "Build: REH ${{ matrix.target }}"
    needs: decide
    if: needs.decide.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      # One failing server must not cancel the others: knowing that only
      # alpine-arm64 is broken is the whole of the diagnosis. The app is not
      # packaged either way — it needs all four.
      fail-fast: false
      matrix:
        target: [linux-x64, alpine-x64, linux-arm64, alpine-arm64]
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      # The same verified download a developer's `pnpm build` makes
      # (scripts/ensure_reh.py); it prints what it could not get.
      - name: Take the server from the reh release if it is published
        id: published
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          missing="$(scripts/ensure_reh.py --from-release "$TARGET" --out-dir dist/reh)"
          if [ -n "$missing" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "$TARGET is not published for this identity: building it"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "$TARGET is published for this identity: downloaded, not building"
          fi

      # The tree is a full VS Code with every nested node_modules, Chromium's
      # clang and two sysroots: well over 10 GB in the Docker volume, more than
      # the runner's root disk has free out of the box.
      - name: Make room for the build tree
        if: steps.published.outputs.build == 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Let Docker run arm64 containers
        if: steps.published.outputs.build == 'true' && endsWith(matrix.target, '-arm64')
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build the server
        if: steps.published.outputs.build == 'true'
        env:
          # Passed into the containers by name, for the downloads upstream's
          # steps make from GitHub (sysroots, prebuilt binaries); only for the
          # rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/build_reh.py ${{ matrix.target }} --out-dir dist/reh

      # To the macOS job, which bundles it, and to `reh-publish`.
      - name: Hand the server to the packaging job
        uses: actions/upload-artifact@v4
        with:
          name: reh-${{ matrix.target }}
          path: |
            dist/reh/*.tar.gz
            dist/reh/*.json
          retention-days: 1
          if-no-files-found: error

  # The servers, by identity, as assets of one rolling prerelease `reh`:
  # `<identity>-devhub-reh-<target>.tar.gz` and its `.json` statement. Only
  # identities the release lacks are uploaded — the same identity is the same
  # server — and all but the six most recently uploaded identities are deleted.
  # `always()` so one failed server does not withhold the others.
  reh-publish:
    name: "Publish: prebuilt REH (reh release)"
    needs: [decide, reh]
    if: >-
      always()
      && needs.decide.result == 'success'
      && needs.decide.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # For scripts/reh_release.py only; no submodule — the identity is read
      # from the statements the `reh` jobs wrote.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collect the servers
        uses: actions/download-artifact@v4
        with:
          pattern: reh-*
          merge-multiple: true
          path: dist/reh

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! ls dist/reh/devhub-reh-*.json >/dev/null 2>&1; then
            echo "no server was built tonight: nothing to publish. Read the red reh jobs." >&2
            exit 1
          fi
          scripts/reh_release.py publish dist/reh --keep 6

  # ---------------------------------------------------------------------------
  # The app: built, then tested as the packaged thing people download, then
  # published. Three jobs, so a red run says which of the three failed.
  # ---------------------------------------------------------------------------

  package:
    name: "Build: DevHub.app (darwin-arm64)"
    # The servers first: the app is not packaged without all four, and
    # package-nightly.py refuses a bundle that would refuse a far machine.
    needs: [decide, reh]
    if: needs.decide.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      date: ${{ steps.meta.outputs.date }}
      sha: ${{ steps.meta.outputs.sha }}
      vscode_sha: ${{ steps.provision.outputs.vscode-sha }}
      artifact: DevHub-darwin-arm64-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Describe this build
        id: meta
        run: |
          {
            echo "date=$(date -u +%Y%m%d)"
            echo "sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # The full `core-ci` bundle: this is what ships.
      - name: Provision VS Code
        id: provision
        uses: ./.github/actions/provision-vscode
        with:
          for: all
          bundle: full

      # Where scripts/package-nightly.py looks for them by default, which is
      # also where scripts/build_reh.py writes on a developer's machine.
      - name: Collect the remote extension hosts
        uses: actions/download-artifact@v4
        with:
          pattern: reh-*
          merge-multiple: true
          path: dist/reh

      # The speech recogniser the composer dictates with: whisper.cpp built
      # with Metal and its model, both made by scripts/build_whisper.py and
      # cached where it caches them on a developer's Mac. A miss is a few
      # minutes of compiling and a 547 MiB download; the key is the script,
      # which pins both by hash.
      - name: Restore the speech recogniser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/devhub/whisper
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_whisper.py') }}
          restore-keys: whisper-${{ runner.os }}-${{ runner.arch }}-

      # The same entry point a developer runs on their own Mac, so there is one
      # build to keep working rather than a local one and a CI one. It repeats
      # the install and the provision above, which are idempotent and cost
      # seconds once done, and then builds DevHub's packages and assembles the
      # bundle and its zip.
      - name: Build DevHub.app
        env:
          # The built-in extension set pulls a handful of extensions from
          # GitHub releases; the token is only there for the rate limit.
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run build

      # The zip is what is tested and what is released: the test job unpacks
      # exactly the archive people download.
      - name: Hand the zip to the test and publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: DevHub-darwin-arm64-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
          path: dist/*.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # Tests against the packaged app, unpacked from the zip that will be
  # released. A macOS runner has a GUI session; this is where the longer
  # end-to-end suite runs once there is one. Today: the smoke test — start the
  # bundle under a throwaway profile and make it answer on its control socket,
  # the only way to catch a bundle whose main process comes up and then stops
  # pumping its event loop.
  test-app:
    name: "Test: packaged app (macOS)"
    needs: package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # For the test scripts only; the app comes from the build job.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collect the zip
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      - name: Unpack it as a person would
        run: ditto -x -k dist/*.zip dist

      - name: Smoke-test the packaged app
        run: scripts/smoke_packaged_app.py dist/DevHub.app

  publish:
    name: "Publish: nightly release"
    needs: [package, test-app]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect the zip
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      - name: Write the release notes
        env:
          VSCODE_SHA: ${{ needs.package.outputs.vscode_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > dist/notes.md <<'NOTES'
          A nightly build of DevHub for macOS on Apple Silicon. It is not
          signed by a registered developer and it is not notarised, so your
          browser quarantines the download. Clear the flag on the **zip**, and
          only then unpack it:

          ```sh
          xattr -d com.apple.quarantine ~/Downloads/DevHub-darwin-arm64-*.zip
          ```

          Then unzip it — double-clicking is enough — and move `DevHub.app`
          where you keep applications. Order matters: whatever unpacks the
          archive copies the flag onto every one of the app's 20,000 files,
          and `xattr -dr` over the unpacked bundle is then the slow way round.
          Cleared on the archive, there is nothing to propagate and nothing to
          clean up. (`No such xattr` means the download was never quarantined;
          carry on.)

          The first launch asks for access to the keychain item "DevHub Safe
          Storage" — that is the app creating the store VS Code keeps secrets
          in. Answer once and it stops asking.

          Requires macOS 15 or later on Apple Silicon. There is no update
          mechanism: replace the app with the next nightly.
          NOTES
          {
            echo ""
            echo "Built from \`$GITHUB_SHA\` with VS Code \`$VSCODE_SHA\`."
            echo ""
            echo "[The run that produced it]($RUN_URL)"
          } >> dist/notes.md

      # One rolling prerelease, replaced whole: the tag has to move to the
      # commit that was packaged, and a release cannot be retagged in place.
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so `gh` has no working tree to infer the
          # repository from and has to be told.
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly ${{ needs.package.outputs.date }} (${{ needs.package.outputs.sha }})
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file dist/notes.md \
            dist/*.zip

  # ---------------------------------------------------------------------------
  # tmux: the terminal multiplexer every terminal and every Agent runs inside,
  # on whichever machine the Workspace lives on.
  #
  # Built on runners of their own architecture rather than cross-built, like the
  # servers above, and gated on whether its release exists, because the answer
  # to "is one needed?" is cheap and the build is not. It is otherwise
  # independent of the servers: this is a function of the tmux version
  # pinned in scripts/build_tmux.py and of nothing in the VS Code submodule, so
  # the release is named after that version and is built once, ever, per bump.
  #
  # Ten minutes of a Linux runner on the night a pin moves, and one minute of
  # the deciding job on every other night. See scripts/build_tmux.py and
  # docs/remote-ssh.md, "tmux on the host".
  # ---------------------------------------------------------------------------

  tmux-decide:
    name: "Decide: a new tmux to build?"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decision.outputs.needed }}
      tag: ${{ steps.decision.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force_tmux }}
        run: |
          set -euo pipefail
          # Asked of the script rather than written here: the version is pinned
          # in one place with the checksum that belongs to it, and a second copy
          # in this file would be the copy that goes stale.
          version="$(scripts/build_tmux.py --print-version)"
          tag="tmux-${version}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # A release that exists is a release every DevHub already installs
          # from, by a URL with that version in it. Rebuilding it would replace
          # working downloads with identical ones.
          if [ "$FORCE" = "true" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "asked to rebuild $tag"
          elif gh release view "$tag" >/dev/null 2>&1; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "$tag is already published"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "no $tag yet"
          fi

  tmux:
    name: "Build: tmux ${{ matrix.target }}"
    needs: tmux-decide
    if: needs.tmux-decide.outputs.needed == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      # As for the servers: one failing architecture must not cancel the other.
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            runner: ubuntu-latest
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      # No submodule and no Node: this build is three ./configure runs over
      # pinned upstream tarballs and touches nothing else in the repository.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # musl, not glibc. A statically linked glibc still dlopens the NSS
      # modules of the machine that built it as soon as anything calls
      # getpwuid, which tmux does at startup to find the login shell — so a
      # glibc build works on the runner and fails on the old host this exists
      # for. scripts/build_tmux.py refuses to fall back to the system compiler.
      - name: Install the musl toolchain
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools build-essential

      - name: Build the tmux tarball
        run: scripts/build_tmux.py ${{ matrix.target }} --out-dir dist

      # Not published here: the release is created once, by the job below, out
      # of whichever architectures got this far. A missing one is a 404 for that
      # architecture alone.
      - name: Hand the tarball to the publishing job
        uses: actions/upload-artifact@v4
        with:
          name: tmux-${{ matrix.target }}
          path: dist/*.tar.gz
          retention-days: 1
          if-no-files-found: error

  # `always()` so one architecture failing does not withhold the other. The
  # failed leg stays red in the run — nothing here reports success on its
  # behalf — and the release carries the assets that exist. `needed` is still
  # the gate: nothing is published on a night the deciding job said there was
  # no new tmux, and nothing is published if that job itself did not answer.
  tmux-publish:
    name: "Publish: tmux release"
    needs: [tmux-decide, tmux]
    if: >-
      always()
      && needs.tmux-decide.result == 'success'
      && needs.tmux-decide.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect the tarballs
        uses: actions/download-artifact@v4
        with:
          pattern: tmux-*
          merge-multiple: true
          path: dist

      # Named after the tmux version and never moved, so a DevHub built before
      # the next bump goes on installing the version it was built against.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          # This job never checks the repository out, so `gh` has no working
          # tree to infer the repository from and has to be told.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.tmux-decide.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/*.tar.gz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "every tmux leg failed: there is nothing to publish for $TAG." >&2
            echo "Read the red legs above; the release is left as it was." >&2
            exit 1
          fi
          ls -l dist
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.tar.gz --clobber
          else
            gh release create "$TAG" \
              --prerelease \
              --target "$GITHUB_SHA" \
              --title "tmux ${TAG#tmux-}" \
              --notes "A statically linked tmux, with libevent and ncurses and a small terminfo database, for the machines DevHub runs terminals and Agents on. DevHub installs it into \`~/.devhub-server/tmux/<version>/\` by itself and never uses a tmux the host already has; see docs/remote-ssh.md for the URL and for installing one by hand." \
              dist/*.tar.gz
          fi
