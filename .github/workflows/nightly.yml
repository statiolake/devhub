# The product build: package `main` every night, test the packaged app, and
# publish it as a rolling prerelease. The per-push CI (ci.yml) only asks
# whether a change is broken; everything that makes a DevHub someone downloads
# — the speech recogniser, the zip, the release — is built here. See
# docs/ci.md.
#
#   Decide ──> Build: DevHub.app ──> Test: packaged app ──> Publish: nightly release
#          └─> Test: visual stability (Linux)
#
# 18:00 UTC is 03:00 the next morning in JST, so the build that runs is the one
# for the day's work. A scheduled run first asks scripts/nightly-build-needed.sh
# whether main has moved since the standing release was cut, and stops there if
# it has not: rebuilding the same commit costs hours of runners, produces an
# equivalent app, and breaks every existing download link to publish it. A run
# someone asks for by hand (Actions -> Nightly -> Run workflow, or `gh workflow
# run Nightly`) always builds — asking for it is the point.
#
# The result is unsigned beyond an ad-hoc signature. Signing needs a paid Apple
# Developer identity in the repository's secrets; until there is one, the
# release notes tell people how to clear the quarantine flag themselves.
#
# The tmux and bash the app bundles are not built here: they come from the
# tools release (tools.yml, scripts/build_tools.py), pinned in product.json.
name: Nightly

on:
  workflow_dispatch:
  schedule:
    # 18:00 UTC = 03:00 JST.
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency:
  # Never two nightlies at once: they would race for the same rolling tag.
  group: nightly
  cancel-in-progress: false

env:
  CI: "true"

jobs:
  # A minute of a Linux runner to decide whether to spend the macOS ones.
  decide:
    name: "Decide: anything new to package?"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.decision.outputs.needed }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Decide
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          # Only the schedule is gated. Someone who opened the Actions tab and
          # pressed the button has said what they want, and a workflow that
          # answers "no thanks" to a direct request is a workflow people stop
          # trusting; a rebuild of the same commit is what they get.
          if [ "$EVENT" != "schedule" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "started by $EVENT, so building regardless"
            exit 0
          fi
          scripts/nightly-build-needed.sh "$GITHUB_SHA"

  # ---------------------------------------------------------------------------
  # The app: built, then tested as the packaged thing people download, then
  # published. Three jobs, so a red run says which of the three failed.
  # ---------------------------------------------------------------------------

  package:
    name: "Build: DevHub.app (darwin-arm64)"
    needs: decide
    if: needs.decide.outputs.needed == 'true'
    runs-on: macos-15
    timeout-minutes: 120
    outputs:
      date: ${{ steps.meta.outputs.date }}
      sha: ${{ steps.meta.outputs.sha }}
      artifact: DevHub-darwin-arm64-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Describe this build
        id: meta
        run: |
          {
            echo "date=$(date -u +%Y%m%d)"
            echo "sha=$(git rev-parse --short HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # The speech recogniser's programs the composer dictates with:
      # whisper.cpp built with Metal by scripts/build_whisper.py, cached where
      # it caches them on a developer's Mac. A miss is a few minutes of
      # compiling; the key is the script, which pins the source by commit.
      # Only the programs: the model is not bundled (the app downloads it
      # when voice input is turned on), so nothing here downloads one, and
      # the `bin` path and its own key prefix keep an older cache's model
      # from being restored and saved again.
      - name: Restore the speech recogniser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/devhub/whisper/bin
          key: whisper-bin-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build_whisper.py') }}
          restore-keys: whisper-bin-${{ runner.os }}-${{ runner.arch }}-

      # The same entry point a developer runs on their own Mac, so there is one
      # build to keep working rather than a local one and a CI one. It repeats
      # the install above, which is idempotent and costs seconds once done,
      # and then builds DevHub and assembles the bundle and its zip.
      - name: Build DevHub.app
        run: pnpm run build

      # The zip is what is tested and what is released: the test job unpacks
      # exactly the archive people download.
      - name: Hand the zip to the test and publish jobs
        uses: actions/upload-artifact@v4
        with:
          name: DevHub-darwin-arm64-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
          path: dist/*.zip
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

  # Tests against the packaged app, unpacked from the zip that will be
  # released. A macOS runner has a GUI session; this is where the longer
  # end-to-end suite runs once there is one. Today: the smoke test — start the
  # bundle under a throwaway profile and make it answer on its control socket,
  # the only way to catch a bundle whose main process comes up and then stops
  # pumping its event loop.
  test-app:
    name: "Test: packaged app (macOS)"
    needs: package
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # For the test scripts only; the app comes from the build job.
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Collect the zip
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      - name: Unpack it as a person would
        run: ditto -x -k dist/*.zip dist

      - name: Smoke-test the packaged app
        run: scripts/smoke_packaged_app.py dist/DevHub.app

  # The visual-stability suite (docs/visual-stability.md): the app from source
  # under Xvfb, each scenario recorded frame by frame at 6x and 1x CPU
  # throttling. Nightly and not per push: about six minutes with the build,
  # and some steps fail now and then on a timing the suite has caught (the
  # doc lists them). It does not hold the release back: what it finds is a
  # flicker, not a broken app.
  test-stability:
    name: "Test: visual stability (Linux)"
    needs: decide
    if: needs.decide.outputs.needed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm

      # Xvfb, xdotool (the window-resize steps), the fixed font, and
      # Electron's libraries (scripts/test-local.sh, LINUX_PACKAGES).
      - name: Install Xvfb, xdotool, fonts and Electron's libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth xdotool fonts-dejavu-core \
            libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1 libxtst6 libxkbfile1 libsecret-1-0

      - name: Build the desktop app
        run: pnpm --filter @devhub/desktop build

      - name: Visual stability
        env:
          DEVHUB_STABILITY_ARTIFACTS: ${{ github.workspace }}/.spike/stability
        run: apps/desktop/test/stability/run.sh

      - name: Keep what it recorded
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-stability
          path: .spike/stability
          if-no-files-found: ignore

  publish:
    name: "Publish: nightly release"
    needs: [package, test-app]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Collect the zip
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist

      - name: Write the release notes
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > dist/notes.md <<'NOTES'
          A nightly build of DevHub for macOS on Apple Silicon. It is not
          signed by a registered developer and it is not notarised, so your
          browser quarantines the download. Clear the flag on the **zip**, and
          only then unpack it:

          ```sh
          xattr -d com.apple.quarantine ~/Downloads/DevHub-darwin-arm64-*.zip
          ```

          Then unzip it — double-clicking is enough — and move `DevHub.app`
          where you keep applications. Order matters: whatever unpacks the
          archive copies the flag onto every one of the app's 20,000 files,
          and `xattr -dr` over the unpacked bundle is then the slow way round.
          Cleared on the archive, there is nothing to propagate and nothing to
          clean up. (`No such xattr` means the download was never quarantined;
          carry on.)

          Requires macOS 15 or later on Apple Silicon. There is no update
          mechanism: replace the app with the next nightly.
          NOTES
          {
            echo ""
            echo "Built from \`$GITHUB_SHA\`."
            echo ""
            echo "[The run that produced it]($RUN_URL)"
          } >> dist/notes.md

      # One rolling prerelease, replaced whole: the tag has to move to the
      # commit that was packaged, and a release cannot be retagged in place.
      - name: Publish the nightly release
        env:
          GH_TOKEN: ${{ github.token }}
          # No checkout here, so `gh` has no working tree to infer the
          # repository from and has to be told.
          GH_REPO: ${{ github.repository }}
          TITLE: Nightly ${{ needs.package.outputs.date }} (${{ needs.package.outputs.sha }})
        run: |
          set -euo pipefail
          if gh release view nightly >/dev/null 2>&1; then
            gh release delete nightly --yes --cleanup-tag
          fi
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes-file dist/notes.md \
            dist/*.zip
