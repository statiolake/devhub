packages:
  - "apps/*"

# pnpm 11 blocks dependency lifecycle scripts by default. Vite's native
# transformer is the only dependency whose install script is required for
# deterministic local builds.
#
# Neither of DevHub's two runtime pieces needs one (docs/without-vscode.md):
#
# - `electron` (pinned in apps/desktop): its binary is fetched the first time
#   `require("electron")` is asked for its path from Node, which
#   `apps/desktop/scripts/electron-path.sh` does for dev.sh, the PTY tests,
#   the smoke test and packaging. pnpm still counts it as a package with a
#   build, so it is named here, off.
# - node-pty is N-API and ships prebuilt binaries for every platform DevHub
#   runs on, loaded from its own `prebuilds/`; its install script would only
#   check that they are there.
allowBuilds:
  electron: false
  esbuild: true
