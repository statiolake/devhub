<?xml version="1.0" encoding="UTF-8"?>
<!--
  DevHub app icon — the hub-and-spokes alternate (not shipped).

  Three satellites on one core: the Editor, the Agent and the Terminal held
  by the shell that runs them. The most literal reading of the name, and the
  reason it is not the icon: at 16 px the spokes fall below a pixel and the
  four white shapes merge into one blob with an orange dot in it. A mark that
  needs four separate shapes to say what it means cannot say it in the Dock.

  Kept so the decision stays re-openable: point scripts/package-icon.sh at one
  of these to try it. It renders on the same 1024 grid as the master.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">DevHub — hub and spokes</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C7CF2"/>
      <stop offset="1" stop-color="#1E2A72"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1030" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" rx="234" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="234" fill="url(#sheen)"/>

  <g filter="url(#lift)" transform="translate(0,83)">
    <path d="M512 512 L512 182 M512 512 L798 677 M512 512 L226 677"
          fill="none" stroke="#FFFFFF" stroke-width="46" stroke-linecap="round"/>
    <circle cx="512" cy="182" r="76" fill="#FFFFFF"/>
    <circle cx="798" cy="677" r="76" fill="#FFFFFF"/>
    <circle cx="226" cy="677" r="76" fill="#FFFFFF"/>
    <rect x="372" y="372" width="280" height="280" rx="82" fill="#FFFFFF"/>
    <circle cx="512" cy="512" r="66" fill="#FFB74A"/>
  </g>
</svg>
