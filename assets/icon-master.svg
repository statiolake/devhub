<?xml version="1.0" encoding="UTF-8"?>
<!--
  DevHub app icon master — the source of truth for distribution/DevHub.icns.

  A D whose counter holds a lit core: the shell is DevHub, and the core is the
  workspace it keeps running inside itself. Two shapes and one accent, which is
  all that survives macOS's 16 px rendering — see icon-master-small.svg for the
  variant the two smallest sizes use instead.

  The canvas is Apple's macOS grid, which is not full bleed: the tile is 824 px
  centred on a 1024 px canvas with a corner radius of 185.4, and the 100 px
  margin around it is transparent and carries the tile's drop shadow. That
  margin is what makes DevHub's tile the same size in the Dock as every other
  app's — a full-bleed icon is drawn 24% larger than its neighbours and looks it.

  The mark keeps its own round-numbered 1024 grid and is mapped onto the tile by
  one transform, so the drawing below can be read without dividing anything by
  0.8046875. Everything in it stays inside that grid's central 832.

  Two things this file draws are drawn again by scripts/package-icon.sh: the
  corner radius, cut there as an alpha mask, and the drop shadow, synthesised
  there from that mask. Both because the renderer that script uses flattens
  transparency onto white, so neither the transparent margin nor a soft shadow
  can survive it. They are here so the file previews as the icon it is; the
  script's copies are the ones that ship.

  Keep this free of text and of third-party marks.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">DevHub</title>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C7CF2"/>
      <stop offset="1" stop-color="#1E2A72"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.5" cy="0" r="0.75">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0B1030" flood-opacity="0.30"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#bg)" filter="url(#tile-shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="185.4" fill="url(#sheen)"/>

  <g transform="translate(100,100) scale(0.8046875)">
    <g filter="url(#lift)">
      <path fill="#FFFFFF" fill-rule="evenodd"
            d="M291 208 H485 A304 304 0 0 1 485 816 H291 A56 56 0 0 1 235 760 V264 A56 56 0 0 1 291 208 Z
               M347 320 H485 A192 192 0 0 1 485 704 H347 Z"/>
      <circle cx="512" cy="512" r="100" fill="#FFB74A"/>
    </g>
  </g>
</svg>
