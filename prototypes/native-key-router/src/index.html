<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevHub F0.3 native key router</title>
    <style>
      :root {
        color-scheme: light;
        font: 13px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
        background: #f2f1ee;
        color: #24252a;
      }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 720px; background: #f2f1ee; }
      header {
        height: 84px;
        display: flex;
        align-items: center;
        gap: 18px;
        padding: 0 24px 0 80px;
        border-bottom: 1px solid #d6d3cb;
        background: #faf9f6;
        user-select: none;
      }
      .mark { color: #386e5e; font-weight: 700; letter-spacing: .05em; }
      .title { color: #3f4249; }
      .hint { margin-left: auto; max-width: 490px; color: #686a70; font-size: 11px; line-height: 1.45; text-align: right; }
      code { color: #8d5f20; }
    </style>
  </head>
  <body>
    <header>
      <span class="mark">DEVHUB / F0.3</span>
      <span class="title">native keyboard + IME host harness</span>
      <span class="hint">⌘1 / ⌘2 focus child · menu hide/show<br />⌘Q arms exact 1000ms prefix · ⌘Q twice forwards native Q</span>
    </header>
  </body>
</html>
