[package]
name = "devhub-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
devhub-app-core = { path = "../../../crates/devhub-app-core" }
devhub-macos-chrome = { path = "../../../crates/devhub-macos-chrome" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "=0.10.9"
flate2 = "=1.1.9"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }
portable-pty = "=0.9.0"
nix = { version = "=0.28.0", features = ["fs", "resource", "signal", "user"] }
rustix = { version = "=0.38.44", features = ["fs"] }
socket2 = "=0.6.5"
raw-window-handle = "=0.6.2"
# `protocol-asset` is how a file the Editor server has on disk reaches the
# browser: an icon theme's font and images are loaded by the browser itself
# rather than read through the connection, and they need an address it will
# accept.
tauri = { version = "=2.11.5", features = ["macos-private-api", "protocol-asset"] }
wry = "=0.55.1"

[target.'cfg(target_os = "macos")'.dependencies]
window-vibrancy = "=0.6.0"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "=0.3.2"
default-features = false
features = ["std", "NSWorkspace"]

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "=0.3.2"
default-features = false
features = ["std", "NSString", "NSURL"]

[dev-dependencies]
serde_json = "1.0"
