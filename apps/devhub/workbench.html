<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Workbench</title>
    <style>
      html,
      body,
      #workbench {
        height: 100%;
        width: 100%;
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <!--
      One Workbench, one document. VS Code is written as though it owns the
      window — fixed-position modals, document-level key handlers, focus that
      belongs to the page — and inside a frame all of that is true again,
      without any of it reaching the App Shell around it.
    -->
    <div id="workbench"></div>
    <script type="module" src="/src/editor/workbench-frame.ts"></script>
  </body>
</html>
